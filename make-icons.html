<!DOCTYPE html>
<!-- Ouvre ce fichier dans un navigateur, clique le bouton, télécharge les 2 icônes -->
<html><body style="font-family:sans-serif;padding:20px">
<h3>Générateur d'icônes PWA</h3>
<canvas id="c"></canvas><br><br>
<button onclick="gen()">Générer et télécharger les icônes</button>
<script>
function makeIcon(size) {
  const c = document.getElementById('c');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const r = size * 0.18;
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#6366f1'); g.addColorStop(1, '#8b5cf6');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(size-r, 0);
  ctx.arcTo(size, 0, size, r, r);
  ctx.lineTo(size, size-r);
  ctx.arcTo(size, size, size-r, size, r);
  ctx.lineTo(r, size);
  ctx.arcTo(0, size, 0, size-r, r);
  ctx.lineTo(0, r);
  ctx.arcTo(0, 0, r, 0, r);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${size*.55}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('€', size/2, size/2);
  return c.toDataURL('image/png');
}
function dl(data, name) {
  const a = document.createElement('a');
  a.href = data; a.download = name; a.click();
}
function gen() {
  dl(makeIcon(192), 'icon-192.png');
  setTimeout(() => dl(makeIcon(512), 'icon-512.png'), 500);
  alert('Deux fichiers téléchargés ! Place-les dans le même dossier que index.html');
}
</script>
</body></html>
